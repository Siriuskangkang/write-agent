services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DATABASE_NAME:-textweaver}
      MYSQL_USER: ${DATABASE_USER:-textweaver}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:-textweaver_local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-textweaver_root_local}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_local}
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_local}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    profiles: ["app"]
    build: ./backend
    ports:
      - "3002:3002"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_NAME: ${DATABASE_NAME:-textweaver}
      DATABASE_USER: ${DATABASE_USER:-textweaver}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-textweaver_local}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_local}
      QDRANT_URL: http://qdrant:6333
      RAG_EVALUATION_DIR: /app/evaluation/rag/artifacts
      RAG_EVALUATION_REPORT: /app/evaluation/rag/artifacts/active.json
    volumes:
      - ./uploads:/app/uploads
      - ./backend/evaluation/rag/artifacts:/app/evaluation/rag/artifacts:ro

  worker:
    profiles: ["app"]
    build: ./backend
    command: ["node", "dist/worker-main.js"]
    ports:
      - "127.0.0.1:9465:9465"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_NAME: ${DATABASE_NAME:-textweaver}
      DATABASE_USER: ${DATABASE_USER:-textweaver}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-textweaver_local}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_local}
      QDRANT_URL: http://qdrant:6333
      UPLOAD_DIR: /app/uploads
      WORKER_MODE: "true"
      ATOMIC_GROUNDING_METRICS_HOST: "0.0.0.0"
      ATOMIC_GROUNDING_METRICS_PORT: "9465"
    volumes:
      - ./uploads:/app/uploads

  frontend:
    profiles: ["app"]
    build: ./frontend
    ports:
      - "8002:8002"
    depends_on:
      - backend
    env_file:
      - path: ./frontend/.env.local
        required: false

  nginx:
    profiles: ["app"]
    image: nginx:alpine
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf

  qdrant:
    image: qdrant/qdrant:v1.13.2
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333; printf \"GET /readyz HTTP/1.0\\r\\n\\r\\n\" >&3; grep -q \"HTTP/1.0 200\" <&3'",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysqldata:
  redisdata:
  qdrantdata:
